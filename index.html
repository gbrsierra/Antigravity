<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento Pro - Sincronizado</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Firebase App (the core Firebase SDK) is always required and must be listed first -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <!-- Add Firebase products that you want to use -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        vehicle: {
                            primary: '#3b82f6',
                            secondary: '#1d4ed8',
                        },
                        bike: {
                            primary: '#10b981',
                            secondary: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            color: #f8fafc;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-primary {
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
        input, textarea, select {
            background: rgba(0, 0, 0, 0.2) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #3b82f6 !important;
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
        .tab-active-vehicle {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border-bottom: 2px solid #3b82f6;
        }
        .tab-active-bike {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border-bottom: 2px solid #10b981;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="flex items-center justify-center p-20 text-slate-500 font-sans tracking-widest animate-pulse uppercase text-sm">Cargando aplicación...</div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className }) => {
            const icons = {
                fileText: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>,
                car: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>,
                bike: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>,
                cloud: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17.5 19a5.5 5.5 0 0 0 5.5-5.5c0-3.04-2.46-5.5-5.5-5.5-.32 0-.64.03-.95.09A8.003 8.003 0 0 0 1 10.5C1 15.19 4.81 19 9.5 19h8Z"/></svg>,
                download: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
                upload: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
                settings: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
                trash: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>,
                plus: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>,
                x: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>,
                calendar: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
                edit: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
                eye: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
                clock: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            };
            return icons[name] || null;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('vehicle');
            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem('maintenance_records');
                return saved ? JSON.parse(saved) : { vehicle: [], bike: [] };
            });
            const [brands, setBrands] = useState(() => {
                const saved = localStorage.getItem('maintenance_brands');
                return saved ? JSON.parse(saved) : { vehicle: 'Mi Vehículo', bike: 'Mi Bicicleta' };
            });
            const [firebaseConfig, setFirebaseConfig] = useState(() => {
                const saved = localStorage.getItem('firebase_config');
                return saved ? JSON.parse(saved) : null;
            });
            const [showForm, setShowForm] = useState(false);
            const [editingRecord, setEditingRecord] = useState(null);
            const [editingBrand, setEditingBrand] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [syncStatus, setSyncStatus] = useState('idle'); // idle, syncing, success, error
            const dbRef = useRef(null);
            const [currentTasks, setCurrentTasks] = useState([{ desc: '', price: '' }]);
            const [invoiceFile, setInvoiceFile] = useState(null);
            const [previewInvoice, setPreviewInvoice] = useState(null);
            const [selectedRecord, setSelectedRecord] = useState(null);

            // Persist to LocalStorage
            useEffect(() => {
                try {
                    localStorage.setItem('maintenance_records', JSON.stringify(records));
                } catch (e) {
                    console.error("No se pudo guardar en localStorage (probablemente excedió la cuota):", e);
                }
            }, [records]);

            useEffect(() => {
                try {
                    localStorage.setItem('maintenance_brands', JSON.stringify(brands));
                } catch (e) {
                    console.error("Error guardando brands:", e);
                }
            }, [brands]);

            // Firebase Integration
            useEffect(() => {
                if (firebaseConfig && !dbRef.current) {
                    try {
                        if (!firebase.apps.length) {
                            firebase.initializeApp(firebaseConfig);
                        }
                        const db = firebase.database();
                        dbRef.current = db.ref('maintenance_data');
                        
                        // Listen for remote changes
                        dbRef.current.on('value', (snapshot) => {
                            const data = snapshot.val();
                            if (data) {
                                if (data.records) setRecords(data.records);
                                if (data.brands) setBrands(data.brands);
                                setSyncStatus('success');
                            }
                        });
                    } catch (err) {
                        console.error("Firebase Init Error:", err);
                        setSyncStatus('error');
                    }
                }
            }, [firebaseConfig]);

            const pushToCloud = (data, type = 'records') => {
                if (dbRef.current) {
                    setSyncStatus('syncing');
                    const updates = type === 'records' ? { records: data } : { brands: data };
                    dbRef.current.update(updates)
                        .then(() => setSyncStatus('success'))
                        .catch(() => setSyncStatus('error'));
                }
            };

            const updateBrand = (newBrand) => {
                const updated = { ...brands, [activeTab]: newBrand };
                setBrands(updated);
                pushToCloud(updated, 'brands');
                setEditingBrand(false);
            };

            const addRecord = (newRecord) => {
                let updated;
                if (editingRecord) {
                    updated = {
                        ...records,
                        [activeTab]: records[activeTab].map(r => r.id === editingRecord.id ? { ...newRecord, id: editingRecord.id } : r)
                    };
                } else {
                    updated = {
                        ...records,
                        [activeTab]: [newRecord, ...(records[activeTab] || [])]
                    };
                }
                setRecords(updated);
                pushToCloud(updated);
                setShowForm(false);
                setEditingRecord(null);
            };

            const handleOpenForm = (record = null) => {
                if (record) {
                    setEditingRecord(record);
                    if (record.tasks && record.tasks.length > 0) {
                        setCurrentTasks(record.tasks);
                    } else {
                        setCurrentTasks([{ desc: record.type || '', price: record.price || '' }]);
                    }
                    setInvoiceFile(record.invoice || null);
                } else {
                    setEditingRecord(null);
                    setCurrentTasks([{ desc: '', price: '' }]);
                    setInvoiceFile(null);
                }
                setShowForm(true);
            };

            const startEdit = (record) => {
                handleOpenForm(record);
            };

            const deleteRecord = (id) => {
                const updated = {
                    ...records,
                    [activeTab]: records[activeTab].filter(r => r.id !== id)
                };
                setRecords(updated);
                pushToCloud(updated);
            };

            const exportData = () => {
                const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `mantenimiento_backup_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.vehicle && data.bike) {
                            setRecords(data);
                            pushToCloud(data);
                            alert("Datos importados con éxito");
                        }
                    } catch (err) {
                        alert("Error al importar el archivo");
                    }
                };
                reader.readAsText(file);
            };

            const themeColor = activeTab === 'vehicle' ? 'vehicle' : 'bike';

            return (
                <div className="max-w-6xl mx-auto px-4 py-8 md:py-12 relative min-h-screen">
                    {/* Header */}
                    <header className="mb-12 text-center relative">
                        <h1 className="text-4xl md:text-5xl font-bold mb-4 tracking-tight">
                            Mantenimiento <span className={activeTab === 'vehicle' ? 'text-blue-500' : 'text-emerald-500'}>Pro</span>
                        </h1>
                        <p className="text-slate-400 text-lg">Tu historial en la nube, sincronizado.</p>
                        
                        <button 
                            onClick={() => setShowSettings(true)}
                            className="absolute top-0 right-0 p-3 glass hover:bg-white/10 transition-colors"
                        >
                            <Icon name="settings" className="w-6 h-6" />
                        </button>
                    </header>

                    {/* Navigation */}
                    <nav className="flex justify-center mb-10">
                        <div className="glass p-1 flex gap-2">
                            <button 
                                onClick={() => {setActiveTab('vehicle'); setShowForm(false);}}
                                className={`px-6 py-3 rounded-xl flex items-center gap-3 transition-all duration-300 ${activeTab === 'vehicle' ? 'tab-active-vehicle shadow-lg' : 'text-slate-400 hover:text-white'}`}
                            >
                                <Icon name="car" className="w-5 h-5" />
                                <span className="font-semibold">Vehículo</span>
                            </button>
                            <button 
                                onClick={() => {setActiveTab('bike'); setShowForm(false);}}
                                className={`px-6 py-3 rounded-xl flex items-center gap-3 transition-all duration-300 ${activeTab === 'bike' ? 'tab-active-bike shadow-lg' : 'text-slate-400 hover:text-white'}`}
                            >
                                <Icon name="bike" className="w-5 h-5" />
                                <span className="font-semibold">Bicicleta</span>
                            </button>
                        </div>
                    </nav>

                    {/* Content */}
                    <main>
                        {!showForm ? (
                            <div class="animate-fade">
                                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sm:gap-0 mb-8 w-full">
                                    <div class="flex items-center gap-4 group">
                                        {editingBrand ? (
                                            <input 
                                                autoFocus
                                                defaultValue={brands[activeTab]}
                                                onBlur={(e) => updateBrand(e.target.value)}
                                                onKeyDown={(e) => e.key === 'Enter' && updateBrand(e.target.value)}
                                                className="text-2xl font-bold bg-transparent border-b border-white/20 !px-1 !py-0 focus:!border-blue-500"
                                            />
                                        ) : (
                                            <h2 className="text-2xl font-bold flex items-center gap-3 text-white">
                                                {brands[activeTab]}
                                                <button onClick={() => setEditingBrand(true)} className="p-1 px-2 hover:bg-white/10 rounded-lg transition-all flex items-center gap-2 border border-white/10">
                                                    <Icon name="edit" className="w-3.5 h-3.5 text-blue-400" />
                                                    <span className="text-[10px] uppercase tracking-widest font-bold text-slate-500">Editar</span>
                                                </button>
                                            </h2>
                                        )}
                                    </div>
                                    <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
                                        {firebaseConfig && (
                                            <div className={`flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold ${syncStatus === 'success' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                                <Icon name="cloud" className={`w-3 h-3 ${syncStatus === 'syncing' ? 'animate-pulse' : ''}`} />
                                                {syncStatus === 'success' ? 'Sincronizado' : syncStatus === 'syncing' ? 'Sincronizando...' : 'Nube activa'}
                                            </div>
                                        )}
                                        <button 
                                            onClick={() => handleOpenForm()}
                                            className={`btn-primary flex items-center gap-2 px-5 py-2.5 rounded-xl font-bold bg-${themeColor === 'primary' ? themeColor : (activeTab === 'vehicle' ? 'blue' : 'emerald')}-600 hover:bg-${activeTab === 'vehicle' ? 'blue' : 'emerald'}-500 shadow-lg`}
                                        >
                                            <Icon name="plus" className="w-5 h-5" />
                                            Nuevo Registro
                                        </button>
                                    </div>
                                </div>

                                {(!records[activeTab] || records[activeTab].length === 0) ? (
                                    <div className="glass p-16 text-center border-dashed border-white/10">
                                        <Icon name={activeTab} className="w-10 h-10 text-slate-500 mx-auto mb-6" />
                                        <h3 className="text-xl font-semibold mb-2">No hay registros todavía</h3>
                                        <button onClick={() => handleOpenForm()} className="text-blue-400 font-bold hover:underline">Crear ahora →</button>
                                    </div>
                                ) : (
                                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {(records[activeTab] || []).map(record => (
                                            <div 
                                                key={record.id} 
                                                class="glass-card p-6 rounded-3xl relative cursor-pointer"
                                                onClick={() => setSelectedRecord(record)}
                                            >
                                                <div class="absolute top-4 right-4 flex gap-2 z-10">
                                                    <button onClick={(e) => { e.stopPropagation(); startEdit(record); }} class="text-slate-500 hover:text-blue-400 transition-colors bg-white/5 p-2 rounded-lg">
                                                        <Icon name="edit" className="w-5 h-5" />
                                                    </button>
                                                    <button onClick={(e) => { e.stopPropagation(); deleteRecord(record.id); }} class="text-slate-500 hover:text-red-400 transition-colors bg-white/5 p-2 rounded-lg">
                                                        <Icon name="trash" className="w-5 h-5" />
                                                    </button>
                                                </div>
                                                <div class="mb-4">
                                                    <span class={`text-xs font-bold uppercase tracking-wider text-${activeTab === 'vehicle' ? 'blue' : 'emerald'}-400 mb-1 block`}>Mantenimiento</span>
                                                    <h3 class="text-xl font-bold line-clamp-2" title={record.type}>{record.type}</h3>
                                                </div>
                                                <div class="space-y-3 mb-6">
                                                    <div class="flex items-center gap-3 text-slate-400 text-sm">
                                                        <Icon name="calendar" className="w-4 h-4" />
                                                        <span>{record.date ? record.date.split('-').reverse().join('/') : ''}</span>
                                                        <span class="mx-1">•</span>
                                                        <span>{record.km ? Number(record.km).toLocaleString('es-ES') : '0'} KM</span>
                                                    </div>
                                                    <div class="flex flex-wrap gap-2 pt-2">
                                                        <span class="glass bg-white/5 px-2 py-1 rounded-lg text-xs font-bold">€{Number(record.price || 0).toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                                                        <span class="glass bg-white/5 px-2 py-1 rounded-lg text-xs">{record.place}</span>
                                                    </div>
                                                </div>
                                                {(record.tasks && Array.isArray(record.tasks) && record.tasks.length > 0) && (
                                                    <div className="bg-black/20 rounded-xl p-3 border border-white/5 space-y-2 mb-4">
                                                        {record.tasks.map((task, i) => (
                                                            <div key={i} className="flex justify-between items-center text-sm gap-4">
                                                                <span className="text-slate-300 truncate" title={task.desc}>{task.desc}</span>
                                                                <span className="font-semibold whitespace-nowrap">{Number(task.price || 0).toLocaleString('es-ES', {minimumFractionDigits: 2, maximumFractionDigits: 2})} €</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                                {record.invoice && (
                                                    <div className="mb-4 flex gap-2">
                                                        <button 
                                                            onClick={(e) => { e.stopPropagation(); setPreviewInvoice(record.invoice); }}

                                                            if (!file) return;
                                                            if (file.type.startsWith('image/')) {
                                                                const reader = new FileReader();
                                                                reader.onload = (event) => {
                                                                    const img = new Image();
                                                                    img.onload = () => {
                                                                        const canvas = document.createElement('canvas');
                                                                        let width = img.width;
                                                                        let height = img.height;
                                                                        const MAX = 1000;
                                                                        if (width > height && width > MAX) {
                                                                            height *= MAX / width;
                                                                            width = MAX;
                                                                        } else if (height > MAX) {
                                                                            width *= MAX / height;
                                                                            height = MAX;
                                                                        }
                                                                        canvas.width = width;
                                                                        canvas.height = height;
                                                                        const ctx = canvas.getContext('2d');
                                                                        ctx.drawImage(img, 0, 0, width, height);
                                                                        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                                                                        setInvoiceFile({ name: file.name, base64: dataUrl });
                                                                    };
                                                                    img.src = event.target.result;
                                                                };
                                                                reader.readAsDataURL(file);
                                                            } else {
                                                                if (file.size > 2 * 1024 * 1024) {

                                                                }

                                                                reader.onload = (event) => setInvoiceFile({ name: file.name, base64: event.target.result });

                                                const config = {
                                                    apiKey: fd.get('apiKey'),
                                                    authDomain: fd.get('authDomain'),
                                                    databaseURL: fd.get('databaseURL'),
                                                    projectId: fd.get('projectId'),
                                                    storageBucket: fd.get('storageBucket'),
                                                    messagingSenderId: fd.get('messagingSenderId'),
                                                    appId: fd.get('appId')
                                                };
                                                localStorage.setItem('firebase_config', JSON.stringify(config));
                                                setFirebaseConfig(config);
                                                window.location.reload(); // Refresh to restart firebase
                                            }}
                                            className="space-y-4"
                                        >
                                            <p className="text-xs text-slate-400 leading-relaxed mb-4">
                                                Para sincronizar entre dispositivos, pega tus credenciales de un proyecto de Firebase (Realtime Database).
                                            </p>
                                            <div className="grid grid-cols-2 gap-3">
                                                <input defaultValue={firebaseConfig?.apiKey} name="apiKey" placeholder="API Key" className="p-2 text-xs rounded-lg" />
                                                <input defaultValue={firebaseConfig?.projectId} name="projectId" placeholder="Project ID" className="p-2 text-xs rounded-lg" />
                                            </div>
                                            <input defaultValue={firebaseConfig?.databaseURL} name="databaseURL" placeholder="Database URL" className="w-full p-2 text-xs rounded-lg" />
                                            <button type="submit" className="w-full py-2 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-sm">Guardar Configuración Nube</button>
                                            {firebaseConfig && <button type="button" onClick={() => { localStorage.removeItem('firebase_config'); window.location.reload(); }} className="w-full py-2 border border-red-500/30 text-red-400 hover:bg-red-500/10 rounded-xl font-bold text-sm mt-2">Desconectar Nube</button>}
                                        </form>
                                    </section>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="mt-20 text-center text-slate-600 text-sm">
                        <p>&copy; 2024 Mantenimiento Pro</p>
                    </footer>
                </div>
            );
        };

        try {
            class ErrorBoundary extends React.Component {
                constructor(props) {
                    super(props);
                    this.state = { hasError: false, error: null };
                }
                static getDerivedStateFromError(error) { return { hasError: true, error }; }
                componentDidCatch(error, errorInfo) { console.error("React Crash:", error, errorInfo); }
                render() {
                    if (this.state.hasError) {
                        return (
                            <div className="p-10 bg-red-900/50 text-white min-h-screen font-sans">
                                <h1 className="text-3xl font-bold mb-4">Algo salió mal</h1>
                                <p className="mb-4">Se ha producido un error al intentar mostrar la aplicación. Esto suele ocurrir si hay un archivo/foto demasiado pesado o un problema de conexión con la nube.</p>
                                <pre className="text-xs bg-black/50 p-4 rounded-xl overflow-auto text-red-200 mb-6 border border-red-500/30">
                                    {this.state.error && this.state.error.toString()}
                                </pre>
                                <button className="px-6 py-3 bg-white/10 hover:bg-white/20 transition-colors rounded-xl font-bold border border-white/20" onClick={() => window.location.reload()}>
                                    Recargar la página
                                </button>
                                <button className="px-6 py-3 ml-4 bg-red-500/20 hover:bg-red-500/40 transition-colors rounded-xl font-bold text-red-100 border border-red-500/30" onClick={() => {
                                    localStorage.removeItem('maintenance_records');
                                    window.location.reload();
                                }}>
                                    Borrar datos locales y Recargar
                                </button>
                            </div>
                        );
                    }
                    return this.props.children;
                }
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<ErrorBoundary><App /></ErrorBoundary>);
        } catch (e) {
            document.getElementById('root').innerHTML = `<div class="p-10 text-red-500">Error de inicio: ${e.message}</div>`;
        }
    </script>
</body>
</html>
